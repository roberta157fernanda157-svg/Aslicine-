services:
  postgres:
    image: postgres:16
    container_name: aslicine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aslicine
      POSTGRES_USER: aslicine
      POSTGRES_PASSWORD: aslicine_dev
    ports:
      - "5432:5432"
    volumes:
      - aslicine_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  aslicine_pgdata:
